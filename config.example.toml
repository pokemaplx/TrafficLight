# Every option can also be set as an environment variable, i.e. TRAFFICLIGHT_OUTPUT=print. Those win over this file

host = "0.0.0.0"
port = 3335
# Host and Port for the Receiver

forward_url = ""
forward_token = ""
# Pass every request on to another endpoint as well, i.e. a Golbat's http://127.0.0.1:9001/raw, so Traffic Light
# can sit in front of your scanner instead of taking its place. Leave empty to not forward anything.
# forward_token is sent as a bearer token if you set one.
# Forwarding is fire and forget: nothing is retried, and an endpoint that is down or slow never slows
# down the receiver or your mitm

output = "web"
# web   = cool interactive ui in your browser
# print = simple log

web_host = "127.0.0.1"
web_port = 3336
# Host and Port for the web ui. Use "0.0.0.0" to open it from other devices
web_open_browser = true
# Open the web ui in your browser when Traffic Light starts
web_max_records = 5000
web_max_memory_mb = 128
# The web ui keeps the newest requests: at most this many, and at most this much of them. Whichever
# is reached first drops the oldest. Traffic Light itself takes about 70 MB on top of the log,
# so this is what decides how much memory it uses. 0 turns the memory limit off
web_password = ""
# Makes the web ui ask for this password. Leave it empty to not ask for one.
# Without a password, the web ui only opens through localhost or an IP address, not a domain

protos_url = "https://raw.githubusercontent.com/ccev/TrafficLight/main/trafficlight/protos/pogo_pb2.py"
protos_update_hours = 6
# Traffic Light looks for newer protos there at startup and every so many hours, and switches to them
# while it runs. Leave protos_url empty to stay with the ones it was built with, and set the hours
# to 0 to only look at startup
methods_url = ""
# A file or url with the names of the game's methods, for the ones the protos don't know yet:
# {"methods": [{"id": 106, "name": "METHOD_GET_MAP_OBJECTS", "request_message": "...", "response_message": "..."}]}

database_url = ""
# Keeps the requests you save in a MariaDB or MySQL database, so they are still there after a restart,
# i.e. "mariadb://user:password@127.0.0.1:3306/trafficlight". Special characters in the password have
# to be percent-encoded. Only saved requests go there: the log itself stays in memory.
# Leave it empty and saved requests live as long as Traffic Light runs

debug_addr = ""
# Serves Go's profiler there, i.e. "127.0.0.1:6060", to see where memory and time go. Leave it empty otherwise
