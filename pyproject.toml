[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "TrafficLight"
version = "0.2.2"
description = "🚦 Beautiful traffic logging for PGO"
authors = [{ name = "Malte", email = "ccev@github.com" }]
readme = "README.md"
# pydantic 1.10 doesn't work on python 3.14
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.8.0,<4.0.0",
    "msgpack>=1.0.4,<2.0.0",
    "requests>=2.28.1,<3.0.0",
    "bbpb>=1.0.0,<2.0.0",
    "Pygments==2.13.0",
    "pydantic==1.10.2",
    "pyperclip==1.8.2",
    "discord.py>=2.0.1,<3.0.0",
    "protobuf==3.20.3",
    "thefuzz[speedup]>=0.19.0,<0.20.0",
    "click>=8.1.3,<9.0.0",
    "textual>=0.9.1,<0.10.0",
]

[project.scripts]
trafficlight = "trafficlight.cli:cli"

[dependency-groups]
dev = ["mypy>=0.991,<0.992"]


[tool.poetry]
packages = [{include = "trafficlight"}]


[tool.black]
line-length = 120
